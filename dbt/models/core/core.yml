version: 2

models:
  - name: dim_users
    description: >
      SCD Type 2 user dimension built from daily snapshots. A new row (version) starts whenever country, device or
      segment changes. valid_to is exclusive; NULL means current. Changes are only observable at snapshot
      (daily) granularity.
    columns:
      - name: user_key
        description: Surrogate key = md5(user_id | valid_from).
        data_tests: [not_null, unique]
      - name: user_id
        data_tests: [not_null]
      - name: version_number
        data_tests: [not_null]
      - name: country
        data_tests:
          - not_null
          - accepted_values: {values: [US, IN, BR, GB, DE, ID, MX, OTHER]}
      - name: device
        data_tests:
          - accepted_values: {values: [ios, android, web]}
      - name: segment
        data_tests:
          - accepted_values: {values: [new, casual, power, dormant]}
      - name: valid_from
        data_tests: [not_null]
      - name: is_current
        data_tests: [not_null]

  - name: dim_content
    description: One row per piece of content.
    columns:
      - name: content_id
        data_tests: [not_null, unique]
      - name: creator_id
        data_tests: [not_null]
      - name: content_type
        data_tests:
          - accepted_values: {values: [video, post, story]}

  - name: dim_date
    description: Calendar dimension covering all signup and event dates.
    columns:
      - name: date_day
        data_tests: [not_null, unique]

  - name: fct_events
    description: >
      One row per valid event. user_key is the SCD2 version of the user that was valid on the event date.
      Incremental: whole event_date partitions are replaced (idempotent re-runs and backfills).
    columns:
      - name: event_id
        data_tests: [not_null, unique]
      - name: event_date
        data_tests: [not_null]
      - name: user_key
        description: Dimension version valid on the event date.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_users'), field: user_key}
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              values: [app_open, content_view, like, comment, share, follow, content_create]
      - name: content_id
        data_tests:
          - relationships:
              to: ref('dim_content')
              field: content_id
              config: {where: "content_id is not null"}
      - name: creator_id
        data_tests:
          - null_rate_below:
              max_rate: 0.0005
              where_sql: "content_id is not null and event_type <> 'content_create'"

  - name: int_user_activity_daily
    description: One row per active user per day (DAU building block).
    data_tests:
      - unique_combination: {columns: [event_date, user_id]}
    columns:
      - name: events
        data_tests: [{value_between: {min_value: 1}}]

  - name: fct_content_engagement
    description: Daily consumption of each piece of content (views and interactions).
    data_tests:
      - unique_combination: {columns: [event_date, content_id]}
    columns:
      - name: views
        data_tests: [{value_between: {min_value: 0}}]
      - name: content_id
        data_tests: [not_null]

  - name: fct_creator_daily_metrics
    description: >
      Per creator per day: posts created and engagement received (views, likes, comments, shares, follows) on their
      content, excluding the creator's own activity.
    data_tests:
      - unique_combination: {columns: [event_date, creator_id]}
    columns:
      - name: creator_id
        data_tests: [not_null]
      - name: engagement_events_received
        data_tests: [{value_between: {min_value: 0}}]
