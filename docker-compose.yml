# Local "production-like" stack: object storage (MinIO, S3-compatible) + PostgreSQL warehouse.
# Spark / dbt / Airflow run inside the `runner` image (see docker/Dockerfile).
services:
  minio:
    # MinIO removed its Docker Hub images; Chainguard publishes a maintained build.
    # If this pull ever fails, use:  image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z  (and drop `user`)
    image: cgr.dev/chainguard/minio:latest
    user: "0:0"   # run as root so the fresh data volume is writable
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console: http://localhost:9001  (minioadmin / minioadmin)
    volumes:
      - minio_data:/data

  postgres:
    image: postgres:16
    shm_size: "512mb"
    command: ["postgres", "-c", "max_parallel_workers_per_gather=0"]
    environment:
      POSTGRES_USER: wh
      POSTGRES_PASSWORD: wh
      POSTGRES_DB: warehouse
    ports:
      - "5433:5432"   # host port 5433 so it does not clash with a local Postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql

  runner:
    build: ./docker
    image: social-warehouse-tools:latest
    entrypoint: []
    user: "0:0"
    working_dir: /opt/project
    volumes:
      - .:/opt/project
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RAW_BUCKET: raw
      LAKE_BUCKET: lake
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: wh
      WAREHOUSE_PASSWORD: wh
    depends_on:
      - minio
      - postgres

  # Orchestrator (Stage 4). Runs the scheduler and web UI in one container for local use;
  # in production these would be separate services with a distributed executor.
  airflow:
    image: social-warehouse-tools:latest
    depends_on:
      - postgres
      - minio
    ports:
      - "8080:8080"   # UI: http://localhost:8080  (admin / admin)
    volumes:
      - .:/opt/project
      - airflow_logs:/opt/airflow/logs
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://wh:wh@postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-only
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "10"
      AIRFLOW__WEBSERVER__WORKERS: "2"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      RAW_BUCKET: raw
      LAKE_BUCKET: lake
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_DB: warehouse
      WAREHOUSE_USER: wh
      WAREHOUSE_PASSWORD: wh
      SPARK_DRIVER_MEMORY: 2g
      # SLACK_WEBHOOK_URL: https://hooks.slack.com/services/...   (optional: pipeline + creator alerts)
    command:
      - bash
      - -c
      - >-
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true) &&
        (airflow scheduler &) && exec airflow webserver

volumes:
  airflow_logs:
  minio_data:
  pg_data:
